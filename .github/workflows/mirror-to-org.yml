name: Mirror to RedHat-MEA-OpenShift

on:
  push:
    branches:
      - '**'       # all branches
    tags:
      - '**'       # all tags
  delete:           # keep mirror clean when branches/tags are deleted
  workflow_dispatch:

jobs:
  mirror:
    # Only run in the source repo. The --mirror push copies this workflow into the
    # org repo too; without this guard it re-runs there, fails on the missing
    # ORG_MIRROR_TOKEN secret, and reports a failure. In the mirrored copy this
    # evaluates false, so the job is skipped instead of failing.
    if: github.repository == 'serhat-dirik/kc-token-exchangeV2-demo'
    runs-on: ubuntu-latest
    steps:
      - name: Bare clone source
        run: |
          git clone --bare https://github.com/${{ github.repository }}.git source.git

      - name: Push mirror to org
        run: |
          cd source.git
          git push --mirror \
            https://x-access-token:${{ secrets.ORG_MIRROR_TOKEN }}@github.com/RedHat-MEA-OpenShift/kc-token-exchangeV2-demo.git