# =============================================================================
# KC-B Deployment — Service IDP (realm-b)
# Trusts KC-A as an external IDP. Receives JWT grants from App-A's M2M client.
# In SPI mode, deploy-openshift.sh patches the image to use the kc-spi ImageStream.
# KC_HOSTNAME_URL placeholder is replaced by deploy-openshift.sh with the Route URL.
# PLACEHOLDER_KC_IMAGE is replaced with the Keycloak version from .env.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kc-b
  labels:
    app: kc-b
    app.kubernetes.io/part-of: kc-token-exchange-demo
    app.kubernetes.io/name: kc-b
    app.kubernetes.io/component: identity-provider
    app.openshift.io/runtime: keycloak
  annotations:
    app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"kc-a"}]'
    app.openshift.io/vcs-uri: 'https://github.com/serhat-dirik/kc-token-exchangeV2-demo'
    app.openshift.io/vcs-ref: 'main'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kc-b
  template:
    metadata:
      labels:
        app: kc-b
    spec:
      containers:
      - name: keycloak
        image: PLACEHOLDER_KC_IMAGE
        args: ["start-dev", "--import-realm"]
        ports:
        - containerPort: 8080
          protocol: TCP
        envFrom:
        - configMapRef:
            name: kc-config
        - secretRef:
            name: kc-credentials
        env:
        - name: KC_HOSTNAME_URL
          value: "PLACEHOLDER_KC_B_ROUTE"
        volumeMounts:
        - name: realm-import
          mountPath: /opt/keycloak/data/import
          readOnly: true
        readinessProbe:
          httpGet:
            path: /realms/master
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            memory: 512Mi
            cpu: 250m
          limits:
            memory: 1Gi
            cpu: "1"
      volumes:
      - name: realm-import
        configMap:
          name: kc-b-realm
