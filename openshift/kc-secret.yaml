# =============================================================================
# Keycloak bootstrap admin credentials — shared by all three KC instances.
# In production, use a unique strong password and rotate credentials.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: kc-credentials
  labels:
    app.kubernetes.io/part-of: kc-token-exchange-demo
type: Opaque
stringData:
  KC_BOOTSTRAP_ADMIN_USERNAME: admin
  KC_BOOTSTRAP_ADMIN_PASSWORD: admin
