# =============================================================================
# KC-A Deployment — User-facing IDP (realm-a)
# The source of truth for users (alice, bob). Issues tokens consumed by App-A.
# KC_HOSTNAME_URL placeholder is replaced by deploy-openshift.sh with the Route URL.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kc-a
  labels:
    app: kc-a
    app.kubernetes.io/part-of: kc-token-exchange-demo
    app.kubernetes.io/name: kc-a
    app.kubernetes.io/component: identity-provider
    app.openshift.io/runtime: keycloak
  annotations:
    app.openshift.io/vcs-uri: 'https://github.com/serhat-dirik/kc-token-exchangeV2-demo'
    app.openshift.io/vcs-ref: 'main'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kc-a
  template:
    metadata:
      labels:
        app: kc-a
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.5.3
        args: ["start-dev", "--import-realm"]
        ports:
        - containerPort: 8080
          protocol: TCP
        envFrom:
        - configMapRef:
            name: kc-config
        - secretRef:
            name: kc-credentials
        env:
        - name: KC_HOSTNAME_URL
          value: "PLACEHOLDER_KC_A_ROUTE"
        volumeMounts:
        - name: realm-import
          mountPath: /opt/keycloak/data/import
          readOnly: true
        readinessProbe:
          httpGet:
            path: /realms/master
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            memory: 512Mi
            cpu: 250m
          limits:
            memory: 1Gi
            cpu: "1"
      volumes:
      - name: realm-import
        configMap:
          name: kc-a-realm
