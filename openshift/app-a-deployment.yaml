# =============================================================================
# App-A Deployment — UI + Service (web-app OIDC type)
# User-facing application with login UI. Calls App-B via JWT Authorization Grant.
# Config is injected via ConfigMap (app-a-config) and Secret (app-a-secrets).
# The ConfigMap is created dynamically by deploy-openshift.sh with Route URLs.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-a
  labels:
    app: app-a
    app.kubernetes.io/part-of: kc-token-exchange-demo
    app.kubernetes.io/name: app-a
    app.kubernetes.io/component: frontend
    app.openshift.io/runtime: quarkus
  annotations:
    app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"kc-a"},{"apiVersion":"apps/v1","kind":"Deployment","name":"app-b"}]'
    app.openshift.io/vcs-uri: 'https://github.com/serhat-dirik/kc-token-exchangeV2-demo'
    app.openshift.io/vcs-ref: 'main'
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"kc-demo-app:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"app\")].image"}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-a
  template:
    metadata:
      labels:
        app: app-a
    spec:
      containers:
      - name: app
        image: PLACEHOLDER_APP_IMAGE
        ports:
        - containerPort: 8080
          protocol: TCP
        envFrom:
        - configMapRef:
            name: app-a-config
        - secretRef:
            name: app-a-secrets
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
