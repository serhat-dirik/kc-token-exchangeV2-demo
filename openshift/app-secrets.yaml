# =============================================================================
# OIDC client secrets for the three Quarkus app instances.
# These values must match what is configured in the realm JSON files.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: app-a-secrets
  labels:
    app: app-a
    app.kubernetes.io/part-of: kc-token-exchange-demo
type: Opaque
stringData:
  QUARKUS_OIDC_CREDENTIALS_SECRET: app-a-secret
  APP_TARGET_KC_CLIENT_SECRET: app-a-m2m-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: app-b-secrets
  labels:
    app: app-b
    app.kubernetes.io/part-of: kc-token-exchange-demo
type: Opaque
stringData:
  QUARKUS_OIDC_CREDENTIALS_SECRET: app-b-secret
  APP_TARGET_KC_CLIENT_SECRET: app-b-m2m-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: app-c-secrets
  labels:
    app: app-c
    app.kubernetes.io/part-of: kc-token-exchange-demo
type: Opaque
stringData:
  QUARKUS_OIDC_CREDENTIALS_SECRET: app-c-secret
