# =============================================================================
# Services for all six components.
# All listen on port 8080 (OpenShift default, no special SCC required).
# KC and App Services are ClusterIP (internal). Routes expose external access.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: kc-a
  labels:
    app: kc-a
    app.kubernetes.io/part-of: kc-token-exchange-demo
spec:
  type: ClusterIP
  selector:
    app: kc-a
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
---
