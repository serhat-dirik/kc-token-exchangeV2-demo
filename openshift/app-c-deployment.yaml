# =============================================================================
# App-C Deployment — Terminal Bearer-only Service
# Called by App-B. No downstream calls (terminal node in the chain).
# Internal only (no Route). Config injected via ConfigMap and Secret.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-c
  labels:
    app: app-c
    app.kubernetes.io/part-of: kc-token-exchange-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-c
  template:
    metadata:
      labels:
        app: app-c
    spec:
      containers:
      - name: app
        image: PLACEHOLDER_APP_IMAGE
        ports:
        - containerPort: 8080
          protocol: TCP
        envFrom:
        - configMapRef:
            name: app-c-config
        - secretRef:
            name: app-c-secrets
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
