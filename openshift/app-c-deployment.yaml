# =============================================================================
# App-C Deployment — Terminal Bearer-only Service
# Called by App-B. No downstream calls (terminal node in the chain).
# Internal only (no Route). Config injected via ConfigMap and Secret.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-c
  labels:
    app: app-c
    app.kubernetes.io/part-of: kc-token-exchange-demo
    app.kubernetes.io/name: app-c
    app.kubernetes.io/component: backend
    app.openshift.io/runtime: quarkus
  annotations:
    app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"kc-c"}]'
    app.openshift.io/vcs-uri: 'https://github.com/serhat-dirik/kc-token-exchangeV2-demo'
    app.openshift.io/vcs-ref: 'main'
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"kc-demo-app:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"app\")].image"}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-c
  template:
    metadata:
      labels:
        app: app-c
    spec:
      containers:
      - name: app
        image: PLACEHOLDER_APP_IMAGE
        ports:
        - containerPort: 8080
          protocol: TCP
        envFrom:
        - configMapRef:
            name: app-c-config
        - secretRef:
            name: app-c-secrets
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
