# =============================================================================
# Provisioning Job template — processed by deploy-openshift.sh with sed.
#
# Placeholders replaced at deploy time:
#   PLACEHOLDER_MODE             — "provisioning" or "spi"
#   PLACEHOLDER_PROVISION_IMAGE  — ImageStream reference for kc-demo-provision
#   PLACEHOLDER_PROVISION_SCRIPT — "provision-users.sh" or "provision-minimal.sh"
#
# The Job patches the provisioning scripts inline to replace localhost URLs
# with internal Service URLs before executing them.
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: kc-provision-PLACEHOLDER_MODE
  labels:
    app.kubernetes.io/part-of: kc-token-exchange-demo
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: kc-provision
    spec:
      containers:
      - name: provision
        image: PLACEHOLDER_PROVISION_IMAGE
        command: ["/bin/bash", "-c"]
        args:
        - |
          echo "Copying provisioning scripts to writable directory..."
          cp /provisioning/*.sh /tmp/
          cd /tmp
          chmod +x *.sh
          echo "Patching provisioning scripts for OpenShift internal URLs..."
          sed -i 's|http://localhost:8180|http://kc-a:8080|g' provision-users.sh provision-minimal.sh provision-common.sh
          sed -i 's|http://localhost:8280|http://kc-b:8080|g' provision-users.sh provision-minimal.sh provision-common.sh
          sed -i 's|http://localhost:8380|http://kc-c:8080|g' provision-users.sh provision-minimal.sh provision-common.sh
          sed -i "s|ADMIN_USER=\"admin\"|ADMIN_USER=\"${ADMIN_USER}\"|g" provision-users.sh provision-minimal.sh provision-common.sh
          sed -i "s|ADMIN_PASS=\"admin\"|ADMIN_PASS=\"${ADMIN_PASS}\"|g" provision-users.sh provision-minimal.sh provision-common.sh
          echo "Running PLACEHOLDER_PROVISION_SCRIPT..."
          ./PLACEHOLDER_PROVISION_SCRIPT
        env:
        - name: ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: kc-credentials
              key: KC_BOOTSTRAP_ADMIN_USERNAME
        - name: ADMIN_PASS
          valueFrom:
            secretKeyRef:
              name: kc-credentials
              key: KC_BOOTSTRAP_ADMIN_PASSWORD
      restartPolicy: Never
