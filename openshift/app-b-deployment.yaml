# =============================================================================
# App-B Deployment — Bearer-only Service
# Called by App-A. Calls App-C via JWT Authorization Grant.
# Internal only (no Route). Config injected via ConfigMap and Secret.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-b
  labels:
    app: app-b
    app.kubernetes.io/part-of: kc-token-exchange-demo
    app.kubernetes.io/name: app-b
    app.kubernetes.io/component: backend
    app.openshift.io/runtime: quarkus
  annotations:
    app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"kc-b"},{"apiVersion":"apps/v1","kind":"Deployment","name":"app-c"}]'
    app.openshift.io/vcs-uri: 'https://github.com/serhat-dirik/kc-token-exchangeV2-demo'
    app.openshift.io/vcs-ref: 'main'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-b
  template:
    metadata:
      labels:
        app: app-b
    spec:
      containers:
      - name: app
        image: PLACEHOLDER_APP_IMAGE
        ports:
        - containerPort: 8080
          protocol: TCP
        envFrom:
        - configMapRef:
            name: app-b-config
        - secretRef:
            name: app-b-secrets
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 500m
