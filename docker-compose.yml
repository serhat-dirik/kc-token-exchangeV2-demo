# =============================================================================
# 3 Keycloak instances for the Token Exchange V2 demo
# KC-A: realm-a (port 8180) - User-facing IDP for App-A
# KC-B: realm-b (port 8280) - Service IDP for App-B, trusts KC-A as external IDP
# KC-C: realm-c (port 8380) - Service IDP for App-C, trusts KC-B as external IDP
#
# Usage: podman-compose up -d  (or docker compose up -d)
# =============================================================================

services:
  kc-a:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.5.3}
    container_name: kc-a
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8080"
      KC_HEALTH_ENABLED: "true"
      KC_FEATURES: "token-exchange-standard:v2,jwt-authorization-grant:v1,organization"
      KC_HOSTNAME_URL: "http://localhost:8180"
    command: start-dev --import-realm
    volumes:
      - ./keycloak/realms/realm-a.json:/opt/keycloak/data/import/realm-a.json:ro
    ports:
      - "8180:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 15

  kc-b:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.5.3}
    container_name: kc-b
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8080"
      KC_HEALTH_ENABLED: "true"
      KC_FEATURES: "token-exchange-standard:v2,jwt-authorization-grant:v1,organization"
      KC_HOSTNAME_URL: "http://localhost:8280"
    command: start-dev --import-realm
    volumes:
      - ./keycloak/realms/realm-b.json:/opt/keycloak/data/import/realm-b.json:ro
    ports:
      - "8280:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 15

  kc-c:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.5.3}
    container_name: kc-c
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8080"
      KC_HEALTH_ENABLED: "true"
      KC_FEATURES: "token-exchange-standard:v2,jwt-authorization-grant:v1,organization"
      KC_HOSTNAME_URL: "http://localhost:8380"
    command: start-dev --import-realm
    volumes:
      - ./keycloak/realms/realm-c.json:/opt/keycloak/data/import/realm-c.json:ro
    ports:
      - "8380:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 15
