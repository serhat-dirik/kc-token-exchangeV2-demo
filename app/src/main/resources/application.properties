# =============================================================================
# KC Token Exchange V2 Demo - Shared Configuration
# =============================================================================
# This application runs as 3 instances (profiles: app-a, app-b, app-c)
# Each instance connects to its own Keycloak instance for OIDC.
# Service chaining: App-A -> App-B -> App-C using RFC 7523 JWT Authorization Grant.
# =============================================================================

# -- Disable Quarkus DevServices (we run our own KC instances) --
quarkus.devservices.enabled=false

# -- Disable dev console (avoids AeshConsole NPE when running without interactive terminal) --
quarkus.console.enabled=false

# -- App name (used in UI/service responses) --
app.name=KC Token Exchange Demo

# -- Target service URL and JWT Grant settings are configured per profile below --
# -- Properties are Optional: omit them for terminal nodes (no downstream) --

# =============================================================================
# Profile: app-a (UI + Service) - Port 8081, KC on 8180
# =============================================================================
%app-a.quarkus.http.port=8081
%app-a.app.name=App-A (UI + Service)

# OIDC config for App-A -> KC-A
%app-a.quarkus.oidc.auth-server-url=http://localhost:8180/realms/realm-a
%app-a.quarkus.oidc.client-id=app-a-client
%app-a.quarkus.oidc.credentials.secret=app-a-secret
%app-a.quarkus.oidc.application-type=web-app
%app-a.quarkus.oidc.roles.source=accesstoken

# App-A calls App-B
%app-a.app.target-service-url=http://localhost:8082/api/hello
%app-a.app.target-kc-token-url=http://localhost:8280/realms/realm-b/protocol/openid-connect/token
%app-a.app.target-kc-client-id=app-a-m2m-client
%app-a.app.target-kc-client-secret=app-a-m2m-secret

# =============================================================================
# Profile: app-b (Service only) - Port 8082, KC on 8280
# =============================================================================
%app-b.quarkus.http.port=8082
%app-b.app.name=App-B (Service)

# OIDC config for App-B -> KC-B (bearer-only service)
%app-b.quarkus.oidc.auth-server-url=http://localhost:8280/realms/realm-b
%app-b.quarkus.oidc.client-id=app-b-client
%app-b.quarkus.oidc.credentials.secret=app-b-secret
%app-b.quarkus.oidc.application-type=service
%app-b.quarkus.oidc.roles.source=accesstoken

# App-B calls App-C
%app-b.app.target-service-url=http://localhost:8083/api/hello
%app-b.app.target-kc-token-url=http://localhost:8380/realms/realm-c/protocol/openid-connect/token
%app-b.app.target-kc-client-id=app-b-m2m-client
%app-b.app.target-kc-client-secret=app-b-m2m-secret

# =============================================================================
# Profile: app-c (Terminal Service) - Port 8083, KC on 8380
# =============================================================================
%app-c.quarkus.http.port=8083
%app-c.app.name=App-C (Terminal Service)

# OIDC config for App-C -> KC-C (bearer-only service)
%app-c.quarkus.oidc.auth-server-url=http://localhost:8380/realms/realm-c
%app-c.quarkus.oidc.client-id=app-c-client
%app-c.quarkus.oidc.credentials.secret=app-c-secret
%app-c.quarkus.oidc.application-type=service
%app-c.quarkus.oidc.roles.source=accesstoken

# App-C is terminal - no further chaining (no target-service-url configured)
