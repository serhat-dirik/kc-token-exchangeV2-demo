# =============================================================================
# DevSpaces Devfile — KC Token Exchange V2 Demo
#
# Opens a fully configured workspace with Java 21, Maven, oc CLI, and all
# the tools needed to develop, build, test, and deploy this demo.
#
# The Universal Developer Image (UDI) includes: Java (multiple versions),
# Maven, oc, kubectl, python3, curl, jq, and git.
#
# Workflow (DevSpaces → OpenShift):
#   01: Build  →  02/03: Deploy to OpenShift  →  04/05: Test  →  06: Clean
#
# Usage: Open this repo from the OpenShift Developer Console DevSpaces link,
#        or paste the Git URL into the DevSpaces dashboard.
# =============================================================================
schemaVersion: 2.2.2
metadata:
  name: kc-token-exchange-v2-demo
  version: 1.0.0
  displayName: KC Token Exchange V2 Demo
  description: >-
    Keycloak Token Exchange V2 (RFC 7523 JWT Authorization Grant) demo
    with Organizations — multi-realm, multi-app service chaining.
  icon: https://www.keycloak.org/resources/images/icon.svg
  tags:
    - Java
    - Quarkus
    - Keycloak
    - OpenShift
  projectType: Quarkus
  language: Java

# ---------------------------------------------------------------------------
# Components
# ---------------------------------------------------------------------------
components:
  - name: tools
    container:
      image: registry.redhat.io/devspaces/udi-rhel8:latest
      memoryLimit: 4Gi
      memoryRequest: 512Mi
      cpuLimit: "2"
      cpuRequest: 200m
      mountSources: true
      endpoints:
        # --- Quarkus App endpoints (for local Quarkus dev mode if needed) ---
        - name: app-a
          targetPort: 8081
          exposure: public
          protocol: https
        - name: app-b
          targetPort: 8082
          exposure: internal
        - name: app-c
          targetPort: 8083
          exposure: internal
        # --- JDWP debug ports ---
        - name: debug-app-a
          targetPort: 5005
          exposure: internal
        - name: debug-app-b
          targetPort: 5006
          exposure: internal
        - name: debug-app-c
          targetPort: 5007
          exposure: internal

# ---------------------------------------------------------------------------
# Commands — numbered for the DevSpaces → OpenShift workflow
#
# Java discovery: The postStart hook finds Java 21 (system JDK or sdkman)
# and writes JAVA_HOME to ~/.java21env. Build commands source this file.
# ---------------------------------------------------------------------------
commands:
  # ---- Workspace initialization (postStart event) ----
  - id: init-workspace
    exec:
      component: tools
      commandLine: >-
        echo "--- Detecting Java 21 ---" &&
        FOUND_JAVA="" &&
        if [ -f "$HOME/.sdkman/bin/sdkman-init.sh" ]; then
          source "$HOME/.sdkman/bin/sdkman-init.sh" 2>/dev/null &&
          SDKMAN_JAVA=$(sdk home java 21 2>/dev/null || sdk home java 21.0 2>/dev/null || true) &&
          if [ -n "$SDKMAN_JAVA" ] && [ -d "$SDKMAN_JAVA" ]; then FOUND_JAVA="$SDKMAN_JAVA"; fi;
        fi &&
        if [ -z "$FOUND_JAVA" ]; then
          for d in /usr/lib/jvm/java-21* /usr/lib/jvm/java-21-openjdk* /usr/lib/jvm/jre-21*; do
            if [ -d "$d" ] && [ -x "$d/bin/java" ]; then FOUND_JAVA="$d"; break; fi;
          done;
        fi &&
        if [ -z "$FOUND_JAVA" ]; then
          FOUND_JAVA=$(dirname $(dirname $(readlink -f $(which java 2>/dev/null) || true)) 2>/dev/null || true);
        fi &&
        if [ -n "$FOUND_JAVA" ] && [ -d "$FOUND_JAVA" ]; then
          echo "export JAVA_HOME=\"$FOUND_JAVA\"" > "$HOME/.java21env" &&
          echo "export PATH=\"$FOUND_JAVA/bin:\$PATH\"" >> "$HOME/.java21env" &&
          source "$HOME/.java21env" &&
          echo "JAVA_HOME=$FOUND_JAVA" &&
          java -version 2>&1;
        else
          echo "WARN: Could not find Java 21. Using system default." &&
          echo "# no override needed" > "$HOME/.java21env" &&
          java -version 2>&1 || echo "ERROR: No java found";
        fi &&
        echo "Workspace ready."
      workingDir: ${PROJECT_SOURCE}

  # ==== PRIMARY WORKFLOW (OpenShift) ====

  - id: build-apps
    exec:
      label: "01: Build Apps"
      component: tools
      commandLine: >-
        [ -f "$HOME/.java21env" ] && source "$HOME/.java21env";
        ./mvnw package -DskipTests
      workingDir: ${PROJECT_SOURCE}
      group:
        kind: build
        isDefault: true

  - id: deploy-provisioning
    exec:
      label: "02: Deploy to OpenShift — Provisioning Mode"
      component: tools
      commandLine: ./deploy-openshift.sh --mode provisioning
      workingDir: ${PROJECT_SOURCE}
      group:
        kind: deploy
        isDefault: true

  - id: deploy-spi
    exec:
      label: "03: Deploy to OpenShift — SPI Mode"
      component: tools
      commandLine: ./deploy-openshift.sh --mode spi
      workingDir: ${PROJECT_SOURCE}
      group:
        kind: deploy

  - id: test-provisioning
    exec:
      label: "04: Test — Provisioning Mode (OpenShift)"
      component: tools
      commandLine: ./test.sh --mode provisioning --openshift
      workingDir: ${PROJECT_SOURCE}
      group:
        kind: test
        isDefault: true

  - id: test-spi
    exec:
      label: "05: Test — SPI Mode (OpenShift)"
      component: tools
      commandLine: ./test.sh --mode spi --openshift
      workingDir: ${PROJECT_SOURCE}
      group:
        kind: test

  - id: clean-namespace
    exec:
      label: "06: Clean OpenShift Namespace"
      component: tools
      commandLine: ./undeploy-openshift.sh
      workingDir: ${PROJECT_SOURCE}

# ---------------------------------------------------------------------------
# Events — detect Java 21 when workspace starts
# ---------------------------------------------------------------------------
events:
  postStart:
    - init-workspace
